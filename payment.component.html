<form (submit)="$event.preventDefault(); pay(email.value)">
  <h2>Pay $1.00 USD</h2>
  <label>
    Email
    <input #email type="email" autocomplete="email" required [disabled]="busy() || paid()">
  </label>
  <div #cardContainer></div>
  <button type="submit" [disabled]="!ready() || busy() || paid()">
    {{ busy() ? 'Processing…' : paid() ? 'Paid' : 'Pay $1.00 USD' }}
  </button>
  <p role="status" aria-live="polite">{{ message() }}</p>
</form>
